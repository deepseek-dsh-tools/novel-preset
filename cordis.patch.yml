# novel-preset bundle patch：只注册一个 agent preset（写小说模式）。
# 内容来自 2026-10-25 宿主 dump-config 的宿合成结果（源码 2026-10-24 被官方安装包连带删除，
# 原包零 js 文件，此处按 dump 原文复原，只删了 dump 里的分隔注释）。
# 配置改动请改 profile 的 cordis.patch.yml 顶层同 id 覆盖，不要在这里加 config。
- insert:
    - id: preset-novel
      # 2026-10-30: 删掉了原来这行 inject: [biliBasicCompactionPolicy]。
      # bili（billion-context）已退休、服务无人提供 ⇒ preset 挂不起来 ⇒ 写小说模式消失。
      # 现在压缩由 dsh-context-forge 接管（host 层），preset 内不需要等任何外部服务。
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: novel
        name: 写小说模式
        description: 精简预设：保留文件读写、搜索与终端，去掉项目说明、技能目录、子智能体与计划模式。适合长篇写作与长上下文对话，为正文留出更多窗口。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
